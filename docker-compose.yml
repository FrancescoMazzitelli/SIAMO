services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-setup:
    image: python:3.12-slim
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      SIAMO_CONFIG_FILE: /config/settings.toml
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
    entrypoint: ["python", "/scripts/pull_models.py"]

  diagnosis-api:
    build: .
    ports:
      - "8080:8000"
    restart: unless-stopped
    environment:
      SIAMO_CONFIG_FILE: /config/settings.toml
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - .:/app
      - ./config:/config:ro

  streamlit-gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      SIAMO_CONFIG_FILE: /config/settings.toml
    depends_on:
      diagnosis-api:
        condition: service_healthy
    volumes:
      - ./gui:/app
      - ./config:/config:ro
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data: