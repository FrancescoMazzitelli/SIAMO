# --- Servizio Ollama ------------------------------------------------------------------
ollama_base_url = "http://ollama:11434"

# --- Modelli --------------------------------------------------------------------------
# Cambia qui i modelli: vengono scaricati automaticamente da scripts/pull_models.py.
# Se cambi embedding_model aggiorna anche embedding_dimension e ricrea la collezione.
embedding_model = "nomic-embed-text"
embedding_dimension = 768
llm_model = "gemma4:e2b"
llm_temperature = 0.4
ocr_model = "maternion/LightOnOCR-2:1b"

# --- OCR ------------------------------------------------------------------------------
ocr_temperature = 0.1
ocr_max_tokens = 8192
ocr_keep_alive = "30m"
ocr_num_gpu = -1
ocr_max_longest_edge = 1540
ocr_timeout_seconds = 600.0
jpeg_quality = 85

# --- Qdrant ---------------------------------------------------------------------------
qdrant_url = "http://qdrant:6333"
qdrant_collection_name = "medical_knowledge"
qdrant_batch_size = 100

# --- Ingestione documenti -------------------------------------------------------------
# Cartella dei manuali da indicizzare all'avvio (maritime medical guides, in inglese).
documents_dir = "data/documents"
# Un titolo Markdown (##, ###, ...) inizia sempre un nuovo paragrafo, cosi una sezione
# e il suo contenuto restano insieme. I blocchi senza titolo vengono invece accorpati
# finche non raggiungono questa soglia: serve solo al testo senza intestazioni.
min_paragraph_chars = 250
# Un paragrafo piu lungo di questo valore viene spezzato: il paragrafo genitore
# recuperato dal retrieval deve restare contenuto nel contesto dell'LLM.
max_paragraph_chars = 1800
chunk_max_chars = 800
chunk_overlap = 200
# false = OCR su tutte le pagine (scelta attuale); true = usa il layer di testo
# nativo dei PDF quando presente e ricorre all'OCR solo se il PDF e una scansione.
pdf_prefer_text_layer = false
pdf_text_min_chars_per_page = 200
startup_poll_seconds = 5
startup_timeout_seconds = 1800

# --- Lingua e triage ------------------------------------------------------------------
# Traduce il testo del caso in inglese prima della ricerca RAG (documenti in inglese).
translate_input_to_english = true
# L'LLM decide in autonomia se il caso richiede la Glasgow Coma Scale.
auto_gcs_triage = true

# --- Retrieval ------------------------------------------------------------------------
top_k_documents = 5
chunk_candidates_top_k = 10
context_top_k = 5
rerank_excerpt_chars = 700

# --- Diagnosi -------------------------------------------------------------------------
candidate_count = 5
candidate_attempts_extra = 3
confidence_threshold = 0.7
max_followup_rounds = 4

# --- API backend ----------------------------------------------------------------------
api_host = "0.0.0.0"
api_port = 8000
cors_origins = ["*"]

# --- GUI Streamlit --------------------------------------------------------------------
gui_api_url = "http://diagnosis-api:8000"
gui_score_green = 0.75
gui_score_amber = 0.50
